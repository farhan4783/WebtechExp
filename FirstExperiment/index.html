<!DOCTYPE html>
<html>
  <head>
    <title>Table with Images and List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <tr>
        <th>Images</th>
        <th>List</th>
      </tr>
      <tr>
        <td><img src="assets\cat.jpg" alt="Placeholder Image 1" /></td>
        <td>
          <ul>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
          </ul>
        </td>
      </tr>
      <tr>
        <td><img src="assets\dog.jpg" alt="Placeholder Image 2" /></td>
        <td>
          <ol>
            <li>First ordered</li>
            <li>Second ordered</li>
            <li>Third ordered</li>
          </ol>
        </td>
      </tr>
    </table>

    <script src="script.js"></script>
  </body>
</html>
