<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Dialog Box Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>JavaScript Inbuilt Functions & Dialog Boxes</h2>

<button onclick="showDialogs()">Click Me</button>

<script>

function showDialogs()
{
    
    alert("Welcome to JavaScript Dialog Box Demo!");

    
    let result = confirm("Do you want to continue?");

    if(result == true)
    {
       
        let name = prompt("Enter your name:");

        
        let nameLength = name.length;         
        let upperName = name.toUpperCase();   
        let currentDate = new Date();          

        alert(
            "Hello " + upperName +
            "\nLength of your name: " + nameLength +
            "\nCurrent Date & Time: " + currentDate
        );
    }
    else
    {
        alert("You cancelled the operation.");
    }
}

</script>

</body>
</html>
