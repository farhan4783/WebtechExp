<!DOCTYPE html>
<html>
  <head>
    <title>Table with Images and List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="image"><img src="assets/cat.jpg" alt="Cat" /></div>
        <div class="list">
          <ul>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
          </ul>
        </div>
      </div>
      <div class="row">
        <div class="image"><img src="assets/dog.jpg" alt="Dog" /></div>
        <div class="list">
          <ol>
            <li>First ordered</li>
            <li>Second ordered</li>
            <li>Third ordered</li>
          </ol>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
